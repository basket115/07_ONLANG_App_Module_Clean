<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONLANG App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    #app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border-top: 12px solid transparent;
      background: #ffffff;
    }

    .status {
      text-align: center;
      max-width: 500px;
      padding: 28px;
      border-radius: 18px;
    }

    .customer-logo {
      display: none;
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin: 0 auto 18px;
    }

    .status h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .status p {
      margin: 6px 0;
    }

    .customer-id {
      font-weight: bold;
    }

    .customer-name {
      margin-top: 14px;
      font-size: 22px;
      font-weight: bold;
    }

    .error {
      margin-top: 14px;
      color: #b00020;
      font-weight: bold;
    }
.app-navigation {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.app-navigation button {
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  background: #ffffff;
  font-size: 14px;
}

#appContent {
  margin-top: 20px;
  text-align: center;
}

#appContent h2 {
  margin-bottom: 10px;
}
  </style>
</head>

<body>

  <main id="app">
    <div class="status" id="statusBox">

      <img
        id="customerLogo"
        class="customer-logo"
        alt=""
      >

      <h1>ONLANG</h1>
      <p>App V1.0</p>

      <p id="customerStatus">
        Kunden-ID wird geprüft …
      </p>

      <div id="customerResult"></div>
<nav id="appNavigation" class="app-navigation" style="display:none;"></nav>

<section id="appContent" style="display:none;">

  <h2>Willkommen bei ONLANG</h2>

  <p>
    Deine Vereins-App wird hier aufgebaut.
  </p>

</section>

    </div>
  </main>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbzMQreJDGOz8SdncgJyYEMHcj7T1nYrk356FdCuUFQ42JAtg_n9VPUUMZ5EYEn8mXtF/exec';

    const params =
      new URLSearchParams(window.location.search);

    const kundenId =
      (params.get('kunde') || '')
        .trim()
        .toUpperCase();

    const app =
      document.getElementById('app');

    const statusBox =
      document.getElementById('statusBox');

    const customerLogo =
      document.getElementById('customerLogo');

    const customerStatus =
      document.getElementById('customerStatus');

    const customerResult =
      document.getElementById('customerResult');


    if (!kundenId) {

      customerStatus.textContent =
        'Keine Kunden-ID angegeben.';

    } else {

      customerStatus.innerHTML =
        'Kunden-ID erkannt: ' +
        '<span class="customer-id">' +
        escapeHtml(kundenId) +
        '</span>';

      loadAppStart(kundenId);
    }


    async function loadAppStart(id) {

      try {

        customerResult.textContent =
          'Kundendaten werden geladen …';

        const url =
          API_URL +
          '?action=getAppStart&kunde=' +
          encodeURIComponent(id);

        const response =
          await fetch(url);

        if (!response.ok) {
          throw new Error(
            'HTTP_' + response.status
          );
        }

        const data =
          await response.json();

        if (!data.success) {

          customerResult.innerHTML =
            '<div class="error">' +
            escapeHtml(
              data.error ||
              'APP_START_FAILED'
            ) +
            '</div>';

          return;
        }

        const customer =
          data.customer;

applyBranding(customer);
applyLogo(customer);
applyLanguage(customer);
showAppShell();
buildNavigation(customer);

customerResult.innerHTML =
          '<div class="customer-name">' +
          escapeHtml(
            customer.Vereinsname || ''
          ) +
          '</div>' +
          '<p>' +
getText('language', customer.Sprache) +
          escapeHtml(
            customer.Sprache || ''
          ) +
          '</p>';

      } catch (error) {

        customerResult.innerHTML =
          '<div class="error">' +
          'APP_START_FAILED' +
          '</div>';
      }
    }
function applyLanguage(customer) {

  const sprache =
    String(customer.Sprache || '')
      .toLowerCase();

  const idText =
  getText('customerId', sprache);

  customerStatus.innerHTML =
    idText +
    '<span class="customer-id">' +
    escapeHtml(kundenId) +
    '</span>';
}
function getText(key, sprache) {

  const lang =
    String(sprache || 'de')
      .toLowerCase();

  const texts = {

    de: {
      customerId: 'Kunden-ID erkannt: ',
      language: 'Sprache: '
    },

    hu: {
      customerId: 'Ügyfél-azonosító: ',
      language: 'Nyelv: '
    }

  };

  if (texts[lang] && texts[lang][key]) {
    return texts[lang][key];
  }

  return texts.de[key] || key;
}

    function applyBranding(customer) {

      const primaerfarbe =
        String(
          customer.Primaerfarbe || ''
        ).trim();

      const sekundaerfarbe =
        String(
          customer.Sekundaerfarbe || ''
        ).trim();

      const akzentfarbe =
        String(
          customer.Akzentfarbe || ''
        ).trim();


      if (isValidHexColor(primaerfarbe)) {

        app.style.borderTopColor =
          primaerfarbe;

        statusBox.style.backgroundColor =
          primaerfarbe;
      }


      if (isValidHexColor(sekundaerfarbe)) {

        statusBox.style.color =
          sekundaerfarbe;
      }


      if (isValidHexColor(akzentfarbe)) {

        app.style.backgroundColor =
          akzentfarbe;
      }
    }


function applyLogo(customer) {
  const logoUrl =
    String(
      customer.Logo_URL || ''
    ).trim();

  customerLogo.onload = function() {
    customerLogo.style.display = 'block';
  };

  customerLogo.onerror = function() {
    customerLogo.removeAttribute('src');
    customerLogo.style.display = 'none';
  };

  if (!logoUrl) {
    customerLogo.removeAttribute('src');
    customerLogo.style.display = 'none';
    return;
  }

  customerLogo.alt =
    customer.Vereinsname
      ? customer.Vereinsname + ' Logo'
      : 'Vereinslogo';

  customerLogo.style.display = 'none';
  customerLogo.src = logoUrl;
}


    function isValidHexColor(value) {

      return /^#[0-9A-Fa-f]{6}$/
        .test(value);
    }


    function escapeHtml(value) {

      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
function showAppShell() {

  const navigation =
    document.getElementById('appNavigation');

  const content =
    document.getElementById('appContent');

  if (navigation) {
    navigation.style.display = 'flex';
  }

  if (content) {
    content.style.display = 'block';
  }
}
function buildNavigation(customer) {

  const navigation =
    document.getElementById('appNavigation');

  if (!navigation) {
    return;
  }

  const sprache =
    String(customer.Sprache || 'de')
      .toLowerCase();

  const items =
    sprache === 'hu'
      ? [
          'Kezdőlap',
          'Hírek',
          'Csapatok',
          'Mérkőzések',
          'Több'
        ]
      : [
          'Start',
          'News',
          'Teams',
          'Termine',
          'Mehr'
        ];

  navigation.innerHTML =
    items.map(function(item) {
      return '<button onclick="openModule(\'' + item + '\')">' 
       + item +
       '</button>';
    }).join('');
}
function openModule(moduleName) {

  const content =
    document.getElementById('appContent');

  if (!content) {
    return;
  }

  content.innerHTML =
    '<h2>' +
    moduleName +
    '</h2>' +
    '<p>Modul wird vorbereitet.</p>';
}
  </script>

</body>
</html>
