<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONLANG App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    #app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .status {
      text-align: center;
    }

    .status h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .status p {
      margin: 0;
      color: #666;
    }
  </style>
</head>

<body>

  <main id="app">
    <div class="status">
      <h1>ONLANG</h1>
      <p>App V1.0</p>
    </div>
  </main>

</body>
</html>
